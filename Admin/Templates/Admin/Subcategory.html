<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subcategory</title>
</head>
<body>
    <form action="" method="post">
        {% csrf_token %}
        <table border="1d">
            <tr>
                <td>Category</td>
                <td><select name="sel_category" id="">
                    <option value="">...select Category...</option>
                    {% for i in CategoryData %}
                    <option value="{{i.id}}">{{i.category_name}}</option>
                    {% endfor %}
                </select></td>
            </tr>
            <tr>
                <td>SubCategory</td>
                <td><input type="text" name="txt_subcategory" id=""value="{{editData.subcategory_name}}"></td>
            </tr>
            <tr>
                <td colspan="2" align="center"><input type="submit" name="btn_submit" value="Submit"></td>
            </tr>
        </table>
        <table border="1">
            <tr>
                <td>SI NO</td>
                <td>Category</td>
                <td>Subcategory</td>
                <td>Action</td>

            </tr>
            {% for i in SubcategoryData %}
            <tr>
                <td>{{forloop.counter}}</td>
                <td>{{i.category.category_name}}</td>
                <td>{{i.subcategory_name}}</td>
                <td> 
                    <a href="{% url 'Admin:delsubcategory' i.id %}">Delete</a>
                    <a href="{% url 'Admin:eidsubcategory' i.id %}">Edit</a>
                </td>
            </tr>
            {% endfor %}
        </table>
</body>

</html>

{% if msg %}
 
<script>
    alert("{{msg}}")
    window.location="{% url 'Admin:Subcategory' %}"
</script>

{% endif %}
