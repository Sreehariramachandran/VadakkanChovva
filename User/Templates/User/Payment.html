{% extends 'User/Header.html' %}
{% block content %}
<div class="payment-wrapper">
    <div class="payment-card">
        <h2>Secure Payment</h2>
        <table class="payment-table">
            <tr>
                <td class="label-text">Total Amount</td>
                <td>
                    <div class="input-group">
                        <input type="text" class="amount-input" value="{{bookingdata.booking_total}}" readonly>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button id="rzp-button1" class="btn-pay">Pay Now</button>
                </td>
            </tr>
        </table>

        <form action="" method="POST" id="razorpay-form">
            {% csrf_token %}
            <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
            <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
            <input type="hidden" name="razorpay_signature" id="razorpay_signature">
            <input type="hidden" name="txt_amount" value="{{bookingdata.booking_total}}">
        </form>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key_id }}", 
    "amount": "{{ amount_in_paise }}", 
    "currency": "INR",
    "name": "Your Temple/Store Name",
    "description": "Booking Payment",
    "order_id": "{{ payment.id }}", 
    "handler": function (response){
        // On success, fill the hidden form and submit
        document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
        document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
        document.getElementById('razorpay_signature').value = response.razorpay_signature;
        document.getElementById('razorpay-form').submit();
    },
    "theme": {
        "color": "#252525"
    }
};
var rzp1 = new Razorpay(options);
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>
{% endblock content %}
