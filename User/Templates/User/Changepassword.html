{% extends 'User/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changepassword</title>
    <style>
        /* Specific styling to center the form and match the theme */
        .password-container {
            padding: 100px 0;
            background-color: #f8f9fa;
            min-height: 80vh;
        }
        .password-card {
            background: #fff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .password-card h2 {
            margin-bottom: 30px;
            font-weight: 700;
            color: #333;
            text-transform: uppercase;
        }
        .form-table {
            width: 100%;
        }
        .form-table td {
            padding: 10px 5px;
        }
        .form-table input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .btn-submit {
            background-color: #252525;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background-color: #ff4e50;
        }
        .btn-reset {
            background-color: #6c757d;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <div class="password-card">
            <form action="" method="post">
                {% csrf_token %} 
                <h2 align="center">Change Password</h2>
                <table class="form-table">
                    <tr>
                        <td>Old Password</td>
                    <td><input type="text" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required name="txt_oldpass"/></td>
                    </tr>
                    <tr>
                        <td>New Password</td>
                    <td><input type="text" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required name="txt_newpass"/></td>
                    </tr>
                    <tr>
                        <td>Re-Type Password</td>
                    <td><input type="text" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" required name="txt_repass"/></td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center" style="padding-top: 20px;">
                            <input type="submit" name="btn_password" value="Change Password" class="btn-submit">
                            <input type="reset" value="Cancel" class="btn-reset">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>
</body>
</html>
{% if msg %}
<script>
alert("{{msg}}")
    window.location="{% url 'User:Changepassword' %}"
</script>
{% endif %}
{% endblock content %}
