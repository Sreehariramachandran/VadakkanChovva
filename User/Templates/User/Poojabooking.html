{% extends 'User/Header.html' %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking</title>
    <style>
        .booking-container {
            padding: 60px 0;
            background-color: #f8f9fa;
            min-height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .booking-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 550px;
        }
        .booking-card h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #252525;
            font-weight: 700;
            text-transform: uppercase;
        }
        .form-table {
            width: 100%;
            border-collapse: collapse;
        }
        .form-table td {
            padding: 12px 5px;
            color: #555;
            font-weight: 500;
        }
        .form-table input[type="text"],
        .form-table input[type="date"],
        .form-table select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            background-color: #fff;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-table input:focus,
        .form-table select:focus {
            border-color: #ff4e50;
        }
        .btn-submit {
            background-color: #252525;
            color: #fff;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: 0.3s;
            margin-top: 20px;
            text-transform: uppercase;
        }
        .btn-submit:hover {
            background-color: #ff4e50;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="booking-container">
        <div class="booking-card">
            <h2>Pooja Booking</h2>
            <form action="" method="post">
                {% csrf_token %} 
                <table class="form-table">
                    <tr>
                        <td>Name</td>
                        <td><input type="text" name="txt_name" id="" required></td>
                    </tr> 
                    <tr>
                        <td>Mobile Number</td>
                        <td><input type="text" name="txt_number" id="" required></td>
                    </tr> 
                    <tr>
                        <td>Pooja Date</td>
                        <td><input type="date" name="txt_date" id=""></td>
                    </tr> 
                    <tr>
                        <td>Deity</td>
                        <td>
                            <select name="sel_deity" id="sel_deity" required>
                                <option value="">...select deity...</option>
                                {% for i in deityData %}
                                <option value="{{i.id}}">{{i.deity_name}}</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>Pooja</td>
                        <td>
                            <select name="sel_pooja" id="sel_pooja" required>
                                <option value="">...select pooja...</option>
                                {% for i in poojaData %}
                                <option value="{{i.id}}">{{i.pooja_name}}</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>BirthStar</td>
                        <td>
                            <select name="sel_birthstar" id="sel_birthstar" required>
                                <option value="">...select BirthStar...</option>
                                {% for i in birthdata %}
                                <option value="{{i.id}}">{{i.birthstar_name}}</option>
                                {% endfor %}
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" align="center">
                            <input type="submit" name="btn_submit" value="Confirm Booking" class="btn-submit">
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script>
        $("#sel_deity").change(function () {
            var did = $(this).val();
            var ur = "{% url 'User:ajaxpooja' %}"
            $.ajax({
                url: ur,
                data: { did: did, },
                success: function (data) {
                    $("#sel_pooja").html(data);
                },
            });
        });
    </script>
</body>
</html>
{% endblock content %}
