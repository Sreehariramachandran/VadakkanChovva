{% extends 'Guest/Header.html' %}
{% block content %}

<style>
    /* Container Styling */
    .reg-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 50px 20px;
        background-color: #f8f9fa;
        min-height: 80vh;
    }

    .reg-card {
        background: #ffffff;
        padding: 40px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 600px;
    }

    .reg-card h2 {
        margin-bottom: 30px;
        color: #333;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Table Reset & Styling */
    .reg-table {
        width: 100%;
        border-collapse: collapse;
        border: none !important;
        /* Overriding the border="1" */
    }

    .reg-table td {
        padding: 12px 5px;
        border: none !important;
        vertical-align: middle;
        color: #555;
    }

    /* Input Styling */
    .reg-table input[type="text"],
    .reg-table input[type="email"],
    .reg-table input[type="password"],
    .reg-table input[type="date"],
    .reg-table select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        outline: none;
        transition: border-color 0.3s;
    }

    .reg-table input:focus,
    .reg-table select:focus {
        border-color: #007bff;
    }

    .reg-table input[type="file"] {
        font-size: 0.9rem;
    }

    /* Button Styling */
    .btn-container {
        padding-top: 20px !important;
    }

    .btn-submit {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        margin-right: 10px;
        transition: background 0.3s;
    }

    .btn-submit:hover {
        background-color: #0056b3;
    }

    .btn-cancel {
        background-color: #6c757d;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .btn-cancel:hover {
        background-color: #5a6268;
    }

    /* Radio spacing */
    .reg-table input[type="radio"] {
        margin-right: 5px;
        margin-left: 10px;
    }
</style>

<div class="reg-wrapper">
    <div class="reg-card">
        <form action="" method="post" enctype="multipart/form-data">
            <h2 align="center">User Registration</h2>
            {% csrf_token %}
            <table class="reg-table" border="1">
                <tr>
                    <td>Name</td>
                    <td><input required type="text" name="txt_name"
                            title="Name Allows Only Alphabets,Spaces and First Letter Must Be Capital Letter"
                            pattern="^[A-Z]+[a-zA-Z ]*$" 
                            placeholder="Enter Your name"/></td>
                </tr>
                <tr>
                    <td>Email</td>
                    <td><input type="email" required name="txt_email" placeholder="Enter Your Email" /></td>
                </tr>
                <tr>
                    <td>Contact</td>
                    <td><input type="text" required name="txt_contact" pattern="[7-9]{1}[0-9]{9}"
                            title="Phone number with 7-9 and remaing 9 digit with 0-9" 
                            placeholder="Enter Your Contact"
                            /></td>
                </tr>
                <tr>
                    <td>Address</td>
                    <td><input type="text" name="txt_address" placeholder="Enter Your Address" id="" required></td>
                </tr>
                <tr>
                    <td>Gender</td>
                    <td>
                        <input type="radio" name="radio_gender" id="" value="Male">Male
                        <input type="radio" name="radio_gender" id="" value="Female"> Female
                    </td>
                </tr>
                <tr>
                    <td>DOB</td>
                    <td><input type="date" name="date_dob" id=""required></td>
                </tr>
                <tr>
                    <td>District</td>
                    <td>
                        <select name="sel_district" id="sel_district" required>
                            <option value="">...select district...</option>
                            {% for i in districtData %}
                            <option value="{{i.id}}">{{i.district_name}}</option>
                            {% endfor %}
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Place</td>
                    <td>
                        <!-- <select name="sel_place" id="sel_place" required>
                            <option value="">...select place...</option>
                        </select> -->
                        <input type="text" name="sel_place" list="place-suggestions"  required="Type or select a place" autocomplete="off">
                        <datalist id="place-suggestions">
                            </datalist>
                    </td>
                </tr>
                <tr>
                    <td>Photo</td>
                    <td><input type="file" name="file_photo" id="" required></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td><input type="text" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                            title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters"
                            required name="txt_pass" 
                            placeholder="Enter Your Password"
                            /></td>
                </tr>
                <tr>
                    <td>Re-Password</td>
                    <td><input type="password" name="txt_repassword" required="" placeholder="Confirm your Password">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center" class="btn-container">
                        <input type="submit" value="Sign Up" class="btn-submit">
                        <input type="submit" value="Cancel" class="btn-cancel">
                    </td>
                </tr>
            </table>
        </form>
    </div>
</div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script>
    $("#sel_district").change(function () {
        var did = $(this).val();
        var ur = "{% url 'Guest:ajaxplace' %}"
        $.ajax({
            url: ur,
            data: { did: did, },
            success: function (data) {
                console.log(data.option);
                
                $("#place-suggestions").html(data);
            },
        });
    });
</script>
{% if msg %}
<script>
    alert("{{msg}}")
    window.location = "{% url 'Guest:UserRegistration' %}"
</script>
{% endif %}
{% endblock content %}
