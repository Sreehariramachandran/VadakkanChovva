<style>
    :root {
        --primary-color: #ff7a00;
        --secondary-color: #e66c00;
        --bg-gradient: linear-gradient(135deg, #fff5e6 0%, #ffdfb3 100%);
        --text-color: #333;
    }

    body {
        margin: 0;
        padding: 0;
        font-family: 'Poppins', sans-serif;
        background: var(--bg-gradient);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login-wrapper {
        width: 100%;
        max-width: 400px;
        padding: 20px;
    }

    .login-card {
        background: #ffffff;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        border-top: 5px solid var(--primary-color);
        text-align: center;
    }

    .login-card h2 {
        margin-bottom: 30px;
        color: var(--secondary-color);
        font-size: 28px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #555;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        box-sizing: border-box; /* Ensures padding doesn't affect width */
        transition: all 0.3s ease;
        font-size: 16px;
    }

    .form-control:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 8px rgba(255, 122, 0, 0.2);
    }

    .btn-login {
        width: 100%;
        background-color: var(--primary-color);
        color: white;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.3s ease;
        margin-top: 10px;
        margin-bottom: 20px;
    }

    .btn-login:hover {
        background-color: var(--secondary-color);
    }

    .nav-link {
        display: inline-block;
        margin-top: 10px;
        color: #777;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s;
        margin: 0 10px;
    }

    .nav-link:hover {
        color: var(--primary-color);
        text-decoration: underline;
    }

    /* Professional Google Font Import */
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
</style>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="txt_email" class="form-control" placeholder="Enter your email" required>
            </div>

          <div class="form-group">
    <label>Password</label>
    <td>
        <input 
            type="password" 
            class="form-control" 
            placeholder="Enter Password" 
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
            title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" 
            required 
            name="txt_pass" 
        />
    </td>
</div>

            <button type="submit" class="btn-login">Login</button>
            <br>
            <a class="nav-link" href="{% url 'Guest:Index' %}">Home</a>
            <span style="color: #ddd;">|</span>
            <a class="nav-link" href="{% url 'Guest:UserRegistration' %}">User</a>
            <span style="color: #ddd;">|</span>
            <a class="nav-link" href="{% url 'Guest:forgotpassword' %}">Forgot Password</a>
        </form>
    </div>
</div>

{% if msg %}
<script>
alert("{{msg}}")
window.location="{% url 'Guest:Login' %}"
</script>
{% endif %}
